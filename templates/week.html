<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .article { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }
    .article h1 { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.15; margin: 12px 0 18px; }
    .meta { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
    .article h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 32px 0 12px; color: var(--accent); }
    .article p, .article li { color: var(--text-secondary); }
    .article ul { padding-left: 1.2em; margin: 10px 0; }
    .article li { margin: 6px 0; }
    .back { display: inline-flex; margin-bottom: 24px; color: var(--accent); font-size: 14px; }
    .callout {
      margin: 24px 0;
      padding: 16px 18px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 12px 12px 0;
      color: var(--text);
    }
  </style>
</head>
<body>
  <article class="article">
    <a class="back" href="./">← 返回每周主题墙</a>
    <div class="meta">{{WEEK}} · {{DATE}}</div>
    <h1>{{TITLE}}</h1>
    <p class="callout">{{ONE_LINER}}</p>

    <h2>一、本周问题</h2>
    <p>{{QUESTION}}</p>

    <h2>二、关键结论</h2>
    <ul>
      <li>{{TAKEAWAY_1}}</li>
      <li>{{TAKEAWAY_2}}</li>
      <li>{{TAKEAWAY_3}}</li>
    </ul>

    <h2>三、证据与材料</h2>
    <ul>
      <li>{{EVIDENCE_1}}</li>
      <li>{{EVIDENCE_2}}</li>
    </ul>

    <h2>四、适用边界与坑点</h2>
    <ul>
      <li>{{PITFALL_1}}</li>
      <li>{{PITFALL_2}}</li>
    </ul>

    <h2>五、下周可执行动作</h2>
    <ul>
      <li>{{ACTION_1}}</li>
      <li>{{ACTION_2}}</li>
    </ul>
  </article>
</body>
</html>
